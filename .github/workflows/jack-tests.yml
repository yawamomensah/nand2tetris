name: Native Nand2Tetris Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nand2tetris:
    name: Native project fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install official native tools
        run: |
          archive="$RUNNER_TEMP/nand2tetris-tools.zip"
          curl --fail --silent --show-error --location "$TOOLS_URL" --output "$archive"
          echo "$TOOLS_SHA256  $archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/nand2tetris-tools"
          echo "N2T_TOOLS_DIR=$RUNNER_TEMP/nand2tetris-tools/nand2tetris/tools" >> "$GITHUB_ENV"
        env:
          TOOLS_URL: https://drive.google.com/uc?export=download&id=1xZzcMIUETv3u3sdpM_oTJSTetpVee3KZ
          TOOLS_SHA256: 22be29e048f1b90f58dc3c211bb870cc21ca4c680b6ecadff5d9db5bb213a8b4

      - name: Fetch official course project fixtures
        run: |
          git clone --quiet --filter=blob:none --no-checkout https://github.com/nand2tetris/projects.git "$RUNNER_TEMP/official-projects"
          git -C "$RUNNER_TEMP/official-projects" fetch --quiet --depth 1 origin 5bd2184edfd4945ff8a28eb0b237c12cdbe9e498
          git -C "$RUNNER_TEMP/official-projects" checkout --quiet --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/official-projects" sparse-checkout init --cone
          git -C "$RUNNER_TEMP/official-projects" sparse-checkout set projects/01 projects/02 projects/03 projects/04 projects/05 projects/06 projects/07 projects/08 projects/09 projects/11
          echo "N2T_PROJECTS_DIR=$RUNNER_TEMP/official-projects/projects" >> "$GITHUB_ENV"

      - name: Test assembler and VM translators
        run: tests/assembly-vm-tests.sh

      - name: Test HDL hardware modules
        run: tests/hardware-tests.sh

      - name: Test Jack parser and compiler
        run: tests/jack-projects.sh